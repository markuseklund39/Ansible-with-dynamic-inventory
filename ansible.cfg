[defaults]
inventory = ./inventory
inventory_plugins = ./inventory_plugins
remote_user = <user> #Replace with your username
private_key_file = ~/.ssh/id_ed25519
host_key_checking = False
interpreter_python = auto_silent

[inventory]
enable_plugins = hyperv, community.general.nmap, constructed, yaml, ini, auto

[privilege_escalation]
become = True
